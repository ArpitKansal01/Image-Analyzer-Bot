<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Input Form</title>
    <style>
      /* ===== GLOBAL STYLES ===== */
      body {
        margin: 0;
        padding: 0;
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        color: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 100vh;
        overflow-x: hidden;
      }

      /* ===== MAIN FORM CARD ===== */
      .card {
        margin-top: 60px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 20px;
        padding: 40px;
        width: 360px;
        box-shadow: 0 10px 40px rgba(0, 255, 255, 0.3);
        backdrop-filter: blur(10px);
        text-align: center;
        animation: fadeIn 1s ease-in-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      h1 {
        font-size: 2rem;
        margin-bottom: 25px;
        color: #00ffff;
        text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
      }

      label {
        font-size: 1rem;
        color: #b0e0e6;
        display: block;
        margin-top: 15px;
        text-align: left;
      }

      input[type="file"],
      input[type="text"] {
        width: 100%;
        padding: 12px;
        margin-top: 10px;
        border: none;
        border-radius: 8px;
        outline: none;
        background: rgba(255, 255, 255, 0.15);
        color: #ffffff;
        font-size: 1rem;
        transition: all 0.3s ease;
      }

      input[type="file"] {
        color: #b0e0e6;
        cursor: pointer;
      }

      input[type="text"]:focus,
      input[type="file"]:hover {
        background: rgba(255, 255, 255, 0.25);
        box-shadow: 0 0 8px #00ffff;
      }

      input::placeholder {
        color: rgba(255, 255, 255, 0.6);
      }

      button {
        margin-top: 25px;
        padding: 12px 25px;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: bold;
        color: #ffffff;
        background: linear-gradient(90deg, #00c6ff, #0072ff);
        cursor: pointer;
        transition: all 0.3s ease;
        text-shadow: 0 0 5px #00ffff, 0 0 10px #00ffff;
      }

      button:hover {
        background: linear-gradient(90deg, #0072ff, #00c6ff);
        box-shadow: 0 0 15px #00ffff, 0 0 30px #00ffff;
        transform: translateY(-2px);
      }

      /* ===== RESULT BOX ===== */
      .result-box {
        margin-top: 40px;
        width: 90%;
        max-width: 1000px;
        background: rgba(0, 255, 255, 0.08);
        border: 1px solid rgba(0, 255, 255, 0.3);
        border-radius: 15px;
        padding: 25px 40px;
        box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        backdrop-filter: blur(8px);
        animation: fadeInResult 1s ease-in-out;
        overflow-y: auto;
        max-height: 70vh;
      }

      @keyframes fadeInResult {
        from {
          opacity: 0;
          transform: translateY(15px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .result-box h2 {
        font-size: 1.5rem;
        color: #00ffff;
        margin-bottom: 15px;
        text-shadow: 0 0 8px #00ffff;
      }

      /* ===== STYLES INSIDE RESULT ===== */
      .result-box strong {
        color: #00e6e6;
      }
      .result-box ul {
        padding-left: 25px;
      }
      .result-box li {
        margin-bottom: 8px;
        color: #b0e0e6;
        line-height: 1.6;
      }
      .result-box p {
        color: #d0f0f8;
        margin-bottom: 12px;
        line-height: 1.6;
      }
      .result-box h3 {
        color: #00ffff;
        margin-top: 18px;
        margin-bottom: 8px;
        text-shadow: 0 0 6px #00ffff;
      }

      /* ===== FLOATING PARTICLES ===== */
      .particle {
        position: absolute;
        width: 6px;
        height: 6px;
        background: #00ffff;
        border-radius: 50%;
        opacity: 0.5;
        animation: float 10s infinite;
      }

      @keyframes float {
        0% {
          transform: translateY(0) scale(1);
          opacity: 0.6;
        }
        50% {
          transform: translateY(-50px) scale(1.2);
          opacity: 1;
        }
        100% {
          transform: translateY(0) scale(1);
          opacity: 0.6;
        }
      }
    </style>
  </head>

  <body>
    <!-- Background Particles -->
    <div
      class="particle"
      style="top: 10%; left: 20%; animation-delay: 0s"
    ></div>
    <div
      class="particle"
      style="top: 40%; left: 80%; animation-delay: 2s"
    ></div>
    <div
      class="particle"
      style="top: 70%; left: 50%; animation-delay: 4s"
    ></div>
    <div
      class="particle"
      style="top: 30%; left: 60%; animation-delay: 6s"
    ></div>

    <!-- Main Input Form -->
    <div class="card">
      <h1>AI Input Form</h1>
      <form action="/submit" method="post" enctype="multipart/form-data">
        <label for="user_input">Upload Image:</label>
        <input
          type="file"
          accept="image/*"
          name="user_input"
          id="user_input"
          required
        />

        <label for="prompt">Enter Prompt:</label>
        <input
          type="text"
          name="prompt"
          id="prompt"
          placeholder="Describe your analysis request..."
          required
        />

        <button type="submit">Submit</button>
      </form>
    </div>

    <!-- Result Section -->
    {% if result %}
    <div class="result-box">
      <h2>Analysis Result</h2>
      <div class="result-content">{{ result|safe }}</div>
    </div>
    {% endif %}
  </body>
</html>
